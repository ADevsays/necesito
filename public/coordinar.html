<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>COORDINAR | NECESITO</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/icon-192.png" type="image/png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0a0a0a" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(console.error);
        });
      }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <style>
      #mapContainer {
        display: none;
        width: 100%;
        height: calc(100vh - 150px);
        border-radius: var(--radius);
        margin-top: 1rem;
        z-index: 1;
      }
    </style>
  </head>
  <body>
    
    <nav style="display:flex; justify-content:space-between; align-items:center; margin-bottom:1rem; padding: 1rem; background: var(--surface);">
      <h1 style="font-size:1.2rem; margin:0; line-height:1;">Centro de Coordinación</h1>
      <div>
        <button onclick="window.location.href='/'" class="btn-large" style="padding:0.5rem 1rem; font-size:0.9rem; background:var(--bg); border:1px solid var(--border);">Volver</button>
      </div>
    </nav>
    
    <main class="shell" style="padding-top:0;">
      
      <div id="statusBanner" class="status-banner offline">
        🟠 MODO OFFLINE — SIN CONEXIÓN
      </div>
      
      <div id="mapContainer"></div>

      <div id="listContainer">
      <button id="btnPushAlerts" onclick="subscribeToPushNotifications()" class="btn-large mb-6" style="width:100%; border:2px solid var(--primary); color:var(--primary); padding:1rem; text-align:center; display:none;">🔔 ACTIVAR ALERTAS URGENTES</button>

      <button id="btnToggleMap" class="btn-large mb-6" style="width:100%; background:var(--surface); border:2px solid var(--border); padding:1rem; text-align:center;">🗺️ VER MAPA</button>

      <div class="type-tab-group" id="typeTabGroup">
        <button class="type-tab-btn active" data-type-filter="all">TODOS</button>
        <button class="type-tab-btn tab-emergency" data-type-filter="emergency">🚨 EMERGENCIAS</button>
        <button class="type-tab-btn tab-donation" data-type-filter="donation">🎁 DONACIONES</button>
      </div>

      <div class="mb-6" style="display: flex; flex-direction: column; gap: 1rem;">
        <div>
          <label class="micro" style="display:block; margin-bottom:0.25rem;">ZONA</label>
          <select id="regionFilter" style="margin-bottom: 0;">
            <option value="">🗺️ Todas las zonas</option>
            <option value="Manizales">Manizales</option>
            <option value="Cali">Cali</option>
            <option value="Pereira">Pereira</option>
            <option value="Chocó">Chocó</option>
          </select>
        </div>
        <div>
          <label class="micro" style="display:block; margin-bottom:0.25rem;">ESTADO</label>
          <select id="statusFilter" style="margin-bottom: 0;">
            <option value="" selected>Todo (excepto descartados)</option>
            <option value="all">Todo (incluir descartados)</option>
            <option value="new">🆕 Nuevo</option>
            <option value="in_progress">En proceso</option>
            <option value="resolved">Resuelto</option>
            <option value="invalid">Descartado</option>
          </select>
        </div>
      </div>

      <div class="mb-4">
        <h3 id="reportsCountText" style="min-height: 1.5rem;"></h3>
      </div>
      <div id="coordList"></div>
      <div id="scrollObserver" style="height: 20px; width: 100%; margin-top: 1rem;"></div>
      </div> <!-- End listContainer -->
    </main>
    
    <div id="photoModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:9999; align-items:center; justify-content:center; flex-direction:column; padding:1rem; cursor:pointer;" onclick="this.style.display='none'">
      <img id="modalImg" style="max-width:100%; max-height:85vh; object-fit:contain; border:2px solid var(--border);" />
      <button class="btn-large secondary" style="width:100%; margin-top:1rem; max-width: 400px;">CERRAR</button>
    </div>

    <script type="module" src="/coordinar.js"></script>
    <script src="/push.js"></script>
  </body>
</html>
